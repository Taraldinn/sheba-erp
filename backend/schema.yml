          format: date
        deduction_month:
          type: string
          maxLength: 20
        reason:
          type: string
        status:
          $ref: '#/components/schemas/AdvanceSalaryStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        employee:
          type: string
          format: uuid
      required:
      - amount
      - created_at
      - employee
      - employee_name
      - id
      - tenant
    AdvanceSalaryStatusEnum:
      enum:
      - Pending
      - Approved
      - Disbursed
      - Recovered
      type: string
      description: |-
        * `Pending` - Pending
        * `Approved` - Approved
        * `Disbursed` - Disbursed
        * `Recovered` - Recovered
    ApiProtocolEnum:
      enum:
      - REST
      - API
