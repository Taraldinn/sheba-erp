        * `indigo` - Electric Indigo
        * `emerald` - Cyber Emerald
        * `violet` - Ultra Violet
        * `cyan` - Neon Cyan
        * `amber` - Golden Amber
        * `rose` - Vibrant Rose
    AdvanceSalary:
      type: object
