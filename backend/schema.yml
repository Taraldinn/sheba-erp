          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/TenantSubscriptionStatusEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        next_billing_date:
          type: string
          format: date
          nullable: true
        auto_renew:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - package_name
      - price
      - tenant
      - tenant_name
      - tenant_slug
      - updated_at
    TenantSubscriptionStatusEnum:
      enum:
      - active
      - trial
      - past_due
      - paused
      - cancelled
      type: string
      description: |-
        * `active` - Active
        * `trial` - Trial
        * `past_due` - Past Due
        * `paused` - Paused / Suspended
        * `cancelled` - Cancelled
    ThemeModeEnum:
      enum:
      - dark
      - light
      - system
      - midnight
      - cyberpunk
      type: string
      description: |-
        * `dark` - Dark Glassmorphic (Default)
        * `light` - Clean Light Mode
        * `system` - System Default
        * `midnight` - Midnight Deep Blue
        * `cyberpunk` - Cyber Neon
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        customer_phone:
          type: string
          readOnly: true
        assigned_to_name:
          type: string
          readOnly: true
        replies:
          type: array
          items:
            $ref: '#/components/schemas/TicketReply'
          readOnly: true
        ticket_no:
          type: string
          readOnly: true
        category:
          type: string
          maxLength: 100
        subject:
          type: string
          maxLength: 200
        description:
          type: string
        priority:
          $ref: '#/components/schemas/TicketPriorityEnum'
        status:
          $ref: '#/components/schemas/TicketStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
        assigned_to:
          type: integer
          nullable: true
      required:
      - assigned_to_name
      - created_at
      - customer
      - customer_name
      - customer_phone
      - description
      - id
      - replies
      - subject
      - tenant
      - ticket_no
      - updated_at
    TicketPriorityEnum:
      enum:
      - Low
      - Medium
      - High
      - Critical
      type: string
      description: |-
        * `Low` - Low
        * `Medium` - Medium
        * `High` - High
        * `Critical` - Critical / Down
    TicketReply:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sender_name:
          type: string
          maxLength: 100
        is_staff:
          type: boolean
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        ticket:
          type: string
          format: uuid
        sender:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - message
      - sender
      - sender_name
      - ticket
    TicketStatusEnum:
      enum:
      - Open
      - In_Progress
      - Resolved
      - Closed
      type: string
      description: |-
        * `Open` - Open
        * `In_Progress` - In Progress
        * `Resolved` - Resolved
        * `Closed` - Closed
    ToggleInternet:
      type: object
      description: Action-specific request serializer for toggling customer internet
        connectivity.
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          default: toggle
        reason:
          type: string
          default: ''
    TransactionTypeEnum:
      enum:
      - IN
      - OUT
      - RETURN
      type: string
      description: |-
        * `IN` - Stock In / Purchase
        * `OUT` - Stock Out / Dispatch to Client
        * `RETURN` - Return to Store
    UserDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        profile:
          allOf:
          - $ref: '#/components/schemas/StaffProfile'
          readOnly: true
        membership:
          allOf:
          - $ref: '#/components/schemas/StaffMembership'
          readOnly: true
      required:
      - id
      - membership
      - profile
      - username
    UserSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        router_name:
          type: string
          readOnly: true
        username:
          type: string
          maxLength: 100
        ip_address:
          type: string
        mac_address:
          type: string
          maxLength: 50
        caller_id:
          type: string
          maxLength: 100
        uptime:
          type: string
          maxLength: 50
        bytes_in:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        bytes_out:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        connected_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        router:
          type: string
          format: uuid
      required:
      - id
      - ip_address
      - last_seen
      - router
      - router_name
      - tenant
      - username
    VoiceSetting:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_enabled:
          type: boolean
        api_bearer_token:
          type: string
          maxLength: 255
        caller_sender_id:
          type: string
          maxLength: 50
        voice_file_name:
          type: string
          maxLength: 100
        enable_expiry_reminder:
          type: boolean
        call_when:
          type: string
          maxLength: 50
        call_time:
          type: string
          maxLength: 20
        retry_unanswered:
          type: boolean
        max_attempts:
          type: string
          maxLength: 50
        retry_delay:
          type: string
          maxLength: 50
        safe_hours_start:
          type: string
          maxLength: 20
        safe_hours_end:
          type: string
          maxLength: 20
        account_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        calls_today:
          type: integer
          maximum: 2147483647
          minimum: 0
        answered_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        unanswered_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        failed_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        rejected_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        pending_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
      required:
      - id
      - tenant
      - updated_at
    VoiceTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        voice_name:
          type: string
          maxLength: 100
        audio_file_url:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/VoiceTemplateStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
      required:
      - created_at
      - id
      - tenant
      - voice_name
    VoiceTemplateStatusEnum:
      enum:
      - Approved
      - Pending
      - Rejected
      type: string
      description: |-
        * `Approved` - Approved
        * `Pending` - Pending Review
        * `Rejected` - Rejected
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
tags:
- name: 1. Authentication & Users
  description: User login, token generation, active session, and staff profiles.
- name: 2. Customers & Subscribers
  description: Subscriber lifecycle, PPPoE credentials, internet toggle on/off, and
    recharges.
- name: 3. Broadband Packages & Offers
  description: Bandwidth tiers, MikroTik simple queue profiles, special discounts,
    and reseller margins.
- name: 4. Network & Core Routers
  description: MikroTik RouterOS sync, PPPoE active tunnels, live bandwidth telemetry,
    and POP branches.
- name: 5. OLT & Optical ONUs
  description: GPON / EPON chassis management, optical RX power diagnostics, and remote
    ONU reboot.
- name: 6. Billing & Invoices
  description: Automated monthly recurring invoices, payment collection ledger, and
    reseller pricing.
- name: 7. Payments & SMS Gateways
  description: bKash/Nagad gateways, webhook transaction ingestion, and SMS parsers.
- name: 8. Support Desk & NOC Tickets
  description: Incident reports, optical losses, technician dispatch, and staff reply
    threads.
- name: 9. Field Tasks & Maintenance
  description: Work orders, field technician assignments, and repair queues.
- name: 10. HR & Payroll Management
  description: Employees, daily attendance, leave requests, advance salaries, and
    payroll records.
- name: 11. Store & Fiber Inventory
  description: Hardware store catalog, drop cables, SFP transceivers, and stock transactions.
- name: 12. Call Center & Voice Reminders
  description: Call logs, IVR voice templates, and automated bill payment voice reminder
    broadcasts.
- name: 13. Reports & Analytics
  description: Real-time aggregated KPIs, revenue trends, and bandwidth distribution.
- name: 14. Core & Tenant Settings
  description: Multi-tenant organization profiles, company branding, audit logs, and
    health checks.
