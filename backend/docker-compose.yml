services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sheba-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - DATABASE_URL=postgres://${POSTGRES_USER:-sheba_user}:${POSTGRES_PASSWORD:-sheba_secure_password}@postgres:5432/${POSTGRES_DB:-sheba_erp}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - PORT=8000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Celery Worker ──────────────────────────────────────────────────────────
  # Processes async tasks: payment events, network sync jobs, SMS delivery.
  # Run multiple replicas by setting CELERY_WORKER_CONCURRENCY.
  # IMPORTANT: This service MUST be running for recharges, webhook processing,
  #            network sync, and SMS tasks to execute.
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sheba-celery-worker
    restart: unless-stopped
    command: celery -A sheba_core worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4} --queues=default,network,billing
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=postgres://${POSTGRES_USER:-sheba_user}:${POSTGRES_PASSWORD:-sheba_secure_password}@postgres:5432/${POSTGRES_DB:-sheba_erp}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    healthcheck:
      test: ["CMD", "celery", "-A", "sheba_core", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Beat Scheduler ──────────────────────────────────────────────────
  # Triggers periodic tasks: daily expiry, monthly invoices, hourly reconcile.
  # Only ONE beat instance must run at a time — do not scale this service.
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sheba-celery-beat
    restart: unless-stopped
    command: celery -A sheba_core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=postgres://${POSTGRES_USER:-sheba_user}:${POSTGRES_PASSWORD:-sheba_secure_password}@postgres:5432/${POSTGRES_DB:-sheba_erp}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: sheba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sheba_erp}
      POSTGRES_USER: ${POSTGRES_USER:-sheba_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sheba_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sheba_user} -d ${POSTGRES_DB:-sheba_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sheba-redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory $${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --maxmemory $${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
        fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAX_MEMORY: ${REDIS_MAX_MEMORY:-256mb}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  backend_media:
